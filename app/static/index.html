<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock News Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid #21262d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #f0f6fc;
    }

    header span {
      font-size: 12px;
      color: #6e7681;
    }

    button#new-chat {
      font-size: 12px;
      padding: 6px 12px;
      background: transparent;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      cursor: pointer;
    }

    button#new-chat:hover { border-color: #6e7681; color: #e1e4e8; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      display: flex;
      gap: 12px;
      max-width: 780px;
      width: 100%;
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .msg.user .avatar { background: #1f6feb; }
    .msg.assistant .avatar { background: #21262d; border: 1px solid #30363d; }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 680px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: #1f6feb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .bubble {
      background: #161b22;
      border: 1px solid #21262d;
      color: #e1e4e8;
      border-bottom-left-radius: 4px;
    }

    .typing .bubble::after {
      content: "▋";
      animation: blink 0.8s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    #input-area {
      padding: 16px 24px;
      border-top: 1px solid #21262d;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e1e4e8;
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      height: 44px;
      max-height: 160px;
      overflow-y: auto;
      line-height: 1.5;
    }

    #input:focus { border-color: #388bfd; }

    #send {
      background: #1f6feb;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      padding: 0 16px;
      height: 44px;
      display: flex;
      align-items: center;
    }

    #send:hover { background: #388bfd; }
    #send:disabled { background: #21262d; color: #6e7681; cursor: not-allowed; }

    #empty {
      margin: auto;
      text-align: center;
      color: #6e7681;
    }

    #empty h2 { font-size: 20px; color: #8b949e; margin-bottom: 8px; }
    #empty p { font-size: 14px; }
  </style>
</head>
<body>

<header>
  <h1>📈 Stock News Assistant</h1>
  <div style="display:flex;align-items:center;gap:16px">
    <span id="session-label"></span>
    <button id="new-chat" onclick="newChat()">New Chat</button>
  </div>
</header>

<div id="messages">
  <div id="empty">
    <h2>Stock News Assistant</h2>
    <p>Ask anything about recent stock market news.</p>
  </div>
</div>

<div id="input-area">
  <textarea id="input" placeholder="Ask about a stock, ticker, or market event…" rows="1"></textarea>
  <button id="send" onclick="sendMessage()">➤</button>
</div>

<script>
  const BASE = "__BASE_PATH__";
  let sessionId = localStorage.getItem('session_id') || null;

  if (sessionId) {
    document.getElementById('session-label').textContent = 'Session: ' + sessionId.slice(0, 8);
  }

  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });

  function newChat() {
    sessionId = null;
    localStorage.removeItem('session_id');
    document.getElementById('messages').innerHTML = `
      <div id="empty">
        <h2>Stock News Assistant</h2>
        <p>Ask anything about recent stock market news.</p>
      </div>`;
    document.getElementById('session-label').textContent = '';
  }

  function appendMessage(role, text) {
    const empty = document.getElementById('empty');
    if (empty) empty.remove();

    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
      <div class="bubble">${escapeHtml(text)}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = '44px';
    sendBtn.disabled = true;

    appendMessage('user', text);

    // show typing indicator
    const typingDiv = document.createElement('div');
    typingDiv.className = 'msg assistant typing';
    typingDiv.innerHTML = `<div class="avatar">🤖</div><div class="bubble"></div>`;
    document.getElementById('messages').appendChild(typingDiv);
    document.getElementById('messages').scrollTop = 99999;

    try {
      const res = await fetch(`${BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text, session_id: sessionId }),
      });

      typingDiv.remove();
      const msgs = document.getElementById('messages');
      const assistantDiv = appendMessage('assistant', '');
      const bubble = assistantDiv.querySelector('.bubble');
      let fullText = '';

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete last line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let data;
          try { data = JSON.parse(line.slice(6)); } catch (e) { console.warn('SSE parse error', e, line); continue; }
          console.log('token:', data.token, 'bubble:', bubble);
          if (data.token) {
            fullText += data.token;
            bubble.textContent = fullText;
            msgs.scrollTop = msgs.scrollHeight;
          }
          if (data.session_id) {
            sessionId = data.session_id;
            localStorage.setItem('session_id', sessionId);
            document.getElementById('session-label').textContent = 'Session: ' + sessionId.slice(0, 8);
          }
        }
      }
    } catch (err) {
      if (typingDiv.isConnected) typingDiv.remove();
      appendMessage('assistant', 'Error: ' + err.message);
    }

    sendBtn.disabled = false;
    input.focus();
  }
</script>
</body>
</html>
